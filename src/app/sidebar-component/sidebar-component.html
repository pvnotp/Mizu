<button
	class="menu-toggle"
	type="button"
	(click)="toggleMenu()"
	[attr.aria-expanded]="isOpen"
	[attr.aria-label]="isOpen ? 'Close menu' : 'Open menu'"
	aria-controls="site-sidebar"
>
	<span aria-hidden="true"></span>
	<span aria-hidden="true"></span>
	<span aria-hidden="true"></span>
</button>

<aside class="sidebar" aria-label="Site information and menu">
	<div class="sidebar-content">
		<hr class="sidebar-divider" aria-hidden="true" />
		<div class="menu-section">
			<a
				class="sidebar-title"
				routerLink="/menu"
				[queryParams]="{ section: subMenuNames[0] }"
				(click)="closeMenu()"
			>Menu</a>
			<ul class="menu-items">
				@for (name of subMenuNames; track name) {
					<li [class.selected]="name === selected()">
						<a
							routerLink="/menu"
							[queryParams]="{ section: name }"
							[class.selected]="name === selected()"
							(click)="closeMenu()"
						>{{ name }}</a>
					</li>
				}
			</ul>
		</div>

		<hr class="sidebar-divider" aria-hidden="true" />
		<div>About</div>
		<hr class="sidebar-divider" aria-hidden="true" />
		<div>Reviews</div>
		<hr class="sidebar-divider" aria-hidden="true" />
		<div>News</div>
		<hr class="sidebar-divider" aria-hidden="true" />
	</div>
</aside>
