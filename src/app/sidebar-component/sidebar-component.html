<button
	class="menu-toggle"
	type="button"
	(click)="toggleMenu()"
	[attr.aria-expanded]="isOpen"
	[attr.aria-label]="isOpen ? 'Close menu' : 'Open menu'"
	aria-controls="site-sidebar"
>
	<span aria-hidden="true"></span>
	<span aria-hidden="true"></span>
	<span aria-hidden="true"></span>
</button>

<aside class="sidebar" aria-label="Site information and menu">
	<div class="sidebar-content">
		<a routerLink="/" (click)="closeMenu()">Home</a>
		<hr class="sidebar-divider" aria-hidden="true" />
		<a
			href="https://www.doordash.com/store/mizu-(asian-restaurant)-rensselaer-52359069"
			target="_blank"
			rel="noopener noreferrer"
			(click)="closeMenu()"
		>Order Online</a>
		<hr class="sidebar-divider" aria-hidden="true" />
		<div class="menu-section">
			<a
				class="sidebar-title"
				routerLink="/menu"
				[queryParams]="{ section: subMenuNames[0] }"
				(click)="closeMenu()"
			>Menu</a>
			<ul class="menu-items">
				@for (name of subMenuNames; track name) {
					<li [class.selected]="name === selected()">
						<a
							routerLink="/menu"
							[queryParams]="{ section: name }"
							[class.selected]="name === selected()"
							(click)="closeMenu()"
						>{{ name }}</a>
					</li>
				}
			</ul>
		</div>

		<hr class="sidebar-divider" aria-hidden="true" />
		<a routerLink="/about" (click)="closeMenu()">About</a>
		<hr class="sidebar-divider" aria-hidden="true" />
		<a
			href="https://search.google.com/local/reviews?placeid=ChIJg-3qZMrj3YkR76wfJnWPTAI"
			target="_blank"
			rel="noopener noreferrer"
			(click)="closeMenu()"
		>Reviews</a>
		<hr class="sidebar-divider" aria-hidden="true" />
		<a
			href="https://www.facebook.com/profile.php?id=61593907749341"
			target="_blank"
			rel="noopener noreferrer"
			(click)="closeMenu()"
		>News</a>
		<hr class="sidebar-divider" aria-hidden="true" />
	</div>
</aside>
