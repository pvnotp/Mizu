<nav class="sub-menu-tabs" aria-label="Menu sections">
	@for (row of tabRows; track $index) {
		<div class="tab-row">
			@for (name of row; track name) {
				<a
					class="sub-menu-tab"
					routerLink="/menu"
					[queryParams]="{ section: name }"
					[class.selected]="name === selected()"
					[attr.aria-current]="name === selected() ? 'page' : null"
				>
					{{ name }}
				</a>
			}
		</div>
	}
</nav>

<hr class="menu-divider" />

<app-sub-menu-component [name]="selected()" (moreBelow)="moreBelow.set($event)" />

@if (moreBelow()) {
	<div class="scroll-hint" aria-hidden="true"></div>
}

<footer class="menu-footer">
	<span>Call to Order: (518) 818-0168</span>
	<span class="no-break">or <a
		href="https://www.doordash.com/store/mizu-(asian-restaurant)-rensselaer-52359069"
		target="_blank"
		rel="noopener noreferrer"
	>Order Online</a></span>
</footer>
